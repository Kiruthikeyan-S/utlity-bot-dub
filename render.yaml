services:
  - type: web
    name: utility-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: utility_bot
      - key: FIREBASE_PROJECT_ID
        value: utility-bot-web
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: MONGODB_APP_ID
        sync: false
      - key: MONGODB_DATA_API_KEY
        sync: false
